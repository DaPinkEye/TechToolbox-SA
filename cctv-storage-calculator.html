<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCTV Storage Calculator — TechToolbox SA</title><meta name="description" content="Estimate CCTV recording storage from camera count, bitrate and retention days."><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><span>Tech</span>Toolbox <b>SA</b></a><nav><a href="index.html#tools">Tools</a></nav></div></header><main class="wrap tool-page"><a class="back" href="index.html">← Back to tools</a><p class="eyebrow">CCTV</p><h1>CCTV Storage Calculator</h1><p class="lead">Estimate recording storage from camera count, bitrate and retention.</p><div class="tool-shell"><label>Number of cameras</label><input id="cams" type="number" min="1" value="8"><label>Average bitrate per camera (Mbps)</label><input id="mbps" type="number" min=".1" step=".1" value="4"><label>Retention (days)</label><input id="days" type="number" min="1" value="30"><button class="button" id="calc">Calculate</button><div id="result" class="result"></div></div></main><footer><div class="wrap"><strong>TechToolbox SA</strong><span>Free practical IT tools.</span></div></footer><script>function calc(){let c=+cams.value,b=+mbps.value,d=+days.value;let gb=c*b*86400*d/8/1000;let tib=gb/1024;result.style.display='block';result.innerHTML='<table><tr><td>Total bitrate</td><td>'+(c*b).toFixed(1)+' Mbps</td></tr><tr><td>Estimated storage</td><td>'+gb.toFixed(1)+' GB</td></tr><tr><td>Estimated storage (TiB)</td><td>'+tib.toFixed(2)+' TiB</td></tr></table><p style="font-size:13px;color:#61707d">Estimate assumes continuous recording at the entered average bitrate. Actual storage varies with codec, frame rate, motion recording and recorder overhead.</p>'}document.getElementById('calc').onclick=calc;calc();</script></body></html>
