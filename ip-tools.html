<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP Tools — TechToolbox SA</title><meta name="description" content="Quick IPv4 checks and private address identification."><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><span>Tech</span>Toolbox <b>SA</b></a><nav><a href="index.html#tools">Tools</a></nav></div></header><main class="wrap tool-page"><a class="back" href="index.html">← Back to tools</a><p class="eyebrow">NETWORKING</p><h1>Quick IP Address Checker</h1><p class="lead">Check whether an IPv4 address is private, loopback or public.</p><div class="tool-shell"><label>IPv4 address</label><input id="ip" value="192.168.1.10"><button class="button" id="check">Check address</button><div id="result" class="result"></div></div></main><footer><div class="wrap"><strong>TechToolbox SA</strong><span>Free practical IT tools.</span></div></footer><script>function check(){let s=ip.value.trim(),p=s.split('.').map(Number),valid=p.length===4&&p.every(x=>Number.isInteger(x)&&x>=0&&x<=255);if(!valid){result.style.display='block';result.innerHTML='<p class="error">Enter a valid IPv4 address.</p>';return}let [a,b]=p,kind='Public / not in a standard private range';if(a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168))kind='Private IPv4 address';else if(a===127)kind='Loopback address';result.style.display='block';result.innerHTML='<table><tr><td>Address</td><td>'+s+'</td></tr><tr><td>Classification</td><td>'+kind+'</td></tr></table>'}document.getElementById('check').onclick=check;check();</script></body></html>
