<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoE Calculator — TechToolbox SA</title><meta name="description" content="Free Power over Ethernet calculator for estimating switch power requirements."><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><span>Tech</span>Toolbox <b>SA</b></a><nav><a href="index.html#tools">Tools</a></nav></div></header><main class="wrap tool-page"><a class="back" href="index.html">← Back to tools</a><p class="eyebrow">NETWORKING</p><h1>PoE Power Calculator</h1><p class="lead">Estimate the combined device power requirement and add a safety margin.</p><div class="tool-shell"><label>Number of PoE devices</label><input id="count" type="number" min="1" value="8"><label>Average power per device (W)</label><input id="watts" type="number" min=".1" step=".1" value="8"><label>Safety margin (%)</label><input id="margin" type="number" min="0" value="20"><button class="button" id="calc">Calculate</button><div id="result" class="result"></div></div></main><footer><div class="wrap"><strong>TechToolbox SA</strong><span>Free practical IT tools.</span></div></footer><script>function calc(){let c=+count.value,w=+watts.value,m=+margin.value;let base=c*w,total=base*(1+m/100);result.style.display='block';result.innerHTML='<table><tr><td>Device load</td><td>'+base.toFixed(1)+' W</td></tr><tr><td>With safety margin</td><td><strong>'+total.toFixed(1)+' W</strong></td></tr><tr><td>Suggested minimum budget</td><td>'+Math.ceil(total)+' W</td></tr></table>'}document.getElementById('calc').onclick=calc;calc();</script></body></html>
