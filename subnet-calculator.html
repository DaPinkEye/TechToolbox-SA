<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="index.html"><span>Tech</span>Toolbox <b>SA</b></a>
    <nav><a href="index.html#tools">Tools</a></nav>
  </div>
</header>
<main class="wrap tool-page">
  <a class="back" href="index.html">← Back to tools</a>
  <p class="eyebrow">NETWORKING</p>
  <h1>IPv4 Subnet Calculator</h1>
  <p class="lead">Enter an IPv4 address and CIDR prefix to calculate the network details.</p>
  <div class="tool-shell">
    <label for="ip">IPv4 address</label>
    <input id="ip" value="192.168.1.10">
    <label for="prefix">CIDR prefix</label>
    <select id="prefix"></select>
    <button class="button" id="calc">Calculate</button>
    <div id="err" class="error"></div>
    <div id="result" class="result" style="display: none;"></div>
  </div>
</main>
<footer>
  <div class="wrap"><strong>TechToolbox SA</strong><span>Free practical IT tools.</span></div>
</footer>
<script>
const sel=document.getElementById('prefix');
for(let i=0;i<=32;i++){
  let o=document.createElement('option');
  o.value=i;
  o.textContent='/'+i;
  if(i===24)o.selected=true;
  sel.appendChild(o);
}
function ip2n(s){
  let p=s.trim().split('.');
  if(p.length!==4||p.some(x=>!/^\d+$/.test(x)||+x>255))throw Error('Enter a valid IPv4 address.');
  return p.reduce((n,x)=>(n*256)+(+x),0)>>>0;
}
function n2ip(n){
  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
}
function calc(){
  try{
    let ip=ip2n(document.getElementById('ip').value),p=+sel.value;
    let mask=p===0?0:(0xffffffff<<(32-p))>>>0;
    let network=(ip&mask)>>>0,broadcast=(network|(~mask))>>>0;
    let total=2**(32-p),usable=p>=31?total:(p===32?1:Math.max(0,total-2));
    let first=p>=31?n2ip(network):n2ip(network+1),last=p>=31?n2ip(broadcast):n2ip(broadcast-1);
    document.getElementById('err').textContent='';
    document.getElementById('result').style.display='block';
    document.getElementById('result').innerHTML='<table><tr><td>IP address</td><td>'+n2ip(ip)+'</td></tr><tr><td>Subnet mask</td><td>'+n2ip(mask)+'</td></tr><tr><td>Network</td><td>'+n2ip(network)+'</td></tr><tr><td>First usable</td><td>'+first+'</td></tr><tr><td>Last usable</td><td>'+last+'</td></tr><tr><td>Broadcast</td><td>'+n2ip(broadcast)+'</td></tr><tr><td>Usable hosts</td><td>'+usable.toLocaleString()+'</td></tr></table>';
  }catch(e){
    document.getElementById('result').style.display='none';
    document.getElementById('err').textContent=e.message;
  }
}
document.getElementById('calc').onclick=calc;
calc();
</script>
</body>
</html>
